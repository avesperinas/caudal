services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: finances_dev
      POSTGRES_DB: my_finances
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finances -d my_finances"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://finances:finances_dev@postgres:5432/my_finances
      AUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    build: ./scripts/backup
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: finances_dev
      POSTGRES_DB: my_finances
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backups:
