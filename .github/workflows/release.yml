name: release

# Publicar una version:  git tag v1.3.0 && git push --tags
# El resto (build de las dos imagenes, push a ghcr y despliegue) es automatico.
on:
  push:
    tags: ['v*']

jobs:
  # Imagen principal. Es la que escribe la nueva version en infra.
  app:
    # Un workflow reutilizable no puede pedir mas permisos de los que le concede
    # quien lo llama, y el token de este repo es de solo lectura por defecto.
    # Sin este bloque, el run falla antes de arrancar (startup_failure).
    permissions:
      contents: read
      packages: write
    uses: avesperinas/workflows/.github/workflows/release.yml@main
    with:
      app_name: caudal
    secrets:
      infra_token: ${{ secrets.INFRA_TOKEN }}

  # Sidecar de backups de Postgres. Comparte tag con la app, asi que el stack
  # despliega siempre las dos juntas.
  backup:
    permissions:
      contents: read
      packages: write
    uses: avesperinas/workflows/.github/workflows/release.yml@main
    with:
      app_name: caudal
      image_name: caudal-backup
      context: scripts/backup
      dockerfile: scripts/backup/Dockerfile
      bump_infra: false
    secrets:
      infra_token: ${{ secrets.INFRA_TOKEN }}
